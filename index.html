<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG

const W = 1200, H = 800;

canvas.width = W; canvas.height = H;

const $ = (id) => document.getElementById(id);

// Restore name from localStorage
try { $('name_input').value = localStorage.getItem('bingbang_name') || ''; } catch {}

// ═══════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════

const WALLS = [

  {x:840,y:22,w:18,h:130},{x:840,y:280,w:18,h:68},{x:840,y:468,w:18,h:52},{x:840,y:538,w:18,h:82},{x:840,y:744,w:18,h:34},
  {x:22,y:262,w:158,h:18},{x:360,y:262,w:120,h:18},{x:720,y:262,w:120,h:18},{x:1020,y:262,w:158,h:18},
  {x:22,y:520,w:158,h:18},{x:360,y:520,w:120,h:18},{x:720,y:520,w:120,h:18},{x:1020,y:520,w:158,h:18},
  {x:40,y:42,w:130,h:18},{x:40,y:60,w:18,h:90},{x:152,y:60,w:18,h:90},

  {x:898,y:44,w:240,h:20},{x:898,y:160,w:90,h:20},{x:1060,y:160,w:78,h:20},
  {x:510,y:298,w:180,h:48},{x:410,y:358,w:44,h:44},{x:746,y:358,w:44,h:44},
  {x:410,y:464,w:44,h:44},{x:746,y:464,w:44,h:44},

  {x:50,y:568,w:150,h:14},{x:50,y:644,w:150,h:14},{x:50,y:720,w:150,h:14},{x:228,y:568,w:14,h:150},

  {x:894,y:558,w:262,h:16},{x:894,y:638,w:200,h:16},{x:1060,y:654,w:16,h:122},

const FLOOR_ZONES = [
  {x:22,y:22,w:320,h:240,c1:'#170820',c2:'#1e0a28'},
  {x:360,y:22,w:480,h:240,c1:'#0a0a1a',c2:'#0d0d22'},

  {x:360,y:280,w:480,h:240,c1:'#060612',c2:'#08081c'},
  {x:858,y:280,w:320,h:240,c1:'#180d06',c2:'#200f08'},
  {x:22,y:538,w:320,h:240,c1:'#0c0c0c',c2:'#131313'},
  {x:360,y:538,w:480,h:240,c1:'#080808',c2:'#0f0f0f'},
  {x:858,y:538,w:320,h:240,c1:'#0e0c06',c2:'#141008'},
];

// ═══════════════════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx = null;
function getAC(){ if(!audioCtx) try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch{}; return audioCtx; }
function tone(freq,type,dur,vol,freqEnd){
  const ac=getAC(); if(!ac) return;
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd,ac.currentTime+dur);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur);
  }catch{}
}
const snd = {
  shoot:    ()=>tone(480,'square',0.07,0.04,160),
  hit:      ()=>tone(220,'sawtooth',0.07,0.03,80),
  kill:     ()=>{tone(440,'square',0.10,0.06,900); setTimeout(()=>tone(700,'square',0.09,0.04,200),80);},
  freeze:   ()=>tone(880,'sine',0.20,0.05,440),
  explode:  ()=>tone(120,'sawtooth',0.25,0.08,40),
  pickup:   ()=>tone(600,'sine',0.15,0.07,900),
  shield:   ()=>tone(800,'sine',0.18,0.06,1300),
  dash:     ()=>tone(900,'sine',0.10,0.05,200),
  death:    ()=>tone(180,'sawtooth',0.4,0.10,60),
};

// ═══════════════════════════════════════════════════════════════════════════
// NETWORK
// ═══════════════════════════════════════════════════════════════════════════
let ws = null;
let myPid = null;
let mode = 'coop';
let lobby = null;     // last lobby payload
let state = null;     // latest game state
let selfPicking = false;
let lastErr = '';

function connect(){
  return new Promise((res,rej)=>{
    if(ws && ws.readyState === 1) return res(ws);
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${location.host}/ws`;
    ws = new WebSocket(url);
    ws.onopen = () => res(ws);
    ws.onerror = () => rej(new Error('connection failed'));
    ws.onclose = () => { ws=null; showError('Disconnected from server'); goHome(); };
    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      handleMessage(msg);
    };
  });
}

function send(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }

function handleMessage(m){
  if(m.type === 'hello'){ myPid = m.pid; }
  else if(m.type === 'joined'){ myPid = m.pid; mode = m.mode; }
  else if(m.type === 'error'){ showError(m.msg); }
  else if(m.type === 'lobby'){ lobby = m; renderLobby(); }
  else if(m.type === 'cards'){ cardChoices = m.choices; selfPicking = true; }
  else if(m.type === 'state'){
    state = m;
    // events
    if(m.events && m.events.length) processEvents(m.events);
    // not picking anymore?
    if(state.phase === 'playing' || state.phase === 'game_over') {
      const me = state.players.find(p=>p.id===myPid);
      if(me && !me.picking) selfPicking = false;
    }
    if(state.phase === 'game_over') showGameOver();
    if(state.phase !== 'game_over' && currentScreen === 'gameover') hideMenu('menu_gameover');
    if(state.phase !== 'lobby' && currentScreen !== 'game') showGame();
  }
}

function processEvents(evts){
  for(const e of evts){
    if(e.k==='shoot'){ snd.shoot(); }
    else if(e.k==='hit'){
      spawnParticle(e.x,e.y,e.c||'#fff',5,0.3,0.9);
      addDmgNum(e.x,e.y-22,e.d,e.c||'#fff');
      snd.hit(); shake=Math.max(shake,4);
    }
    else if(e.k==='hurt'){
      spawnParticle(e.x,e.y,'#00e5ff',9,0.45,0.8);
      addDmgNum(e.x,e.y-30,e.d,'#ff5566');
      shake=Math.max(shake,8);
    }
    else if(e.k==='botDie'){
      spawnParticle(e.x,e.y,'#8b0000',16,0.6,1.3);
      spawnParticle(e.x,e.y,e.color||'#ff3366',8,0.7,1.2);
      // persistent blood pool + corpse
      addBlood(e.x,e.y);
      addCorpse(e.x,e.y,e.color||'#ff3366');
      shake=Math.max(shake,10); snd.kill();
    }
    else if(e.k==='playerDie'){
      spawnParticle(e.x,e.y,e.color||'#00e5ff',30,1.2,1.6);
      spawnParticle(e.x,e.y,'#fff',12,0.6,1.2);
      addBlood(e.x,e.y);
      shake=Math.max(shake,18); snd.death();
    }
    else if(e.k==='explode'){
      spawnParticle(e.x,e.y,'#ff6600',35,1.1,1.6);
      spawnParticle(e.x,e.y,'#ffcc00',20,0.65,1.2);
      spawnParticle(e.x,e.y,'#ffffff',10,0.4,0.9);
      shake=Math.max(shake,16); snd.explode();
    }
    else if(e.k==='dash'){
      spawnParticle(e.x,e.y,'#00ffee',12,0.3,1.4);
      snd.dash();
    }
    else if(e.k==='shield'){
      spawnParticle(e.x,e.y,'#ffd700',22,0.7,1.6);
      snd.shield();
    }
    else if(e.k==='chain'){
      // lightning arc between two points
      const N=8;
      for(let i=0;i<N;i++){
        spawnParticle(
          e.x1+(e.x2-e.x1)*i/(N-1)+(Math.random()-.5)*22,
          e.y1+(e.y2-e.y1)*i/(N-1)+(Math.random()-.5)*22,
          '#88bbff',1,0.22,0.2);
      }
    }
    else if(e.k==='matchEnd'){ shake=Math.max(shake,20); }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// MENU NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════
let currentScreen = 'home';
function showMenu(id){
  for(const el of document.querySelectorAll('.menu')) el.classList.add('hidden');
  $(id).classList.remove('hidden');
  currentScreen = id.replace('menu_','');
}
function hideMenu(id){ $(id).classList.add('hidden'); }
function showGame(){ for(const el of document.querySelectorAll('.menu')) el.classList.add('hidden'); currentScreen='game'; }
function goHome(){ showMenu('menu_home'); state=null; lobby=null; selfPicking=false; }
function showError(msg){
  lastErr = msg;
  const el = currentScreen==='home' ? $('err_home') : null;
  if(el){ el.textContent = msg; setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; },4000); }
}

// Mode buttons
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  });
});

$('btn_create').addEventListener('click', async ()=>{
  const name = ($('name_input').value || 'Player').trim();
  try { localStorage.setItem('bingbang_name', name); } catch {}
  try { await connect(); } catch { showError('Cannot reach server'); return; }
  send({type:'create', mode, name});
  showMenu('menu_lobby');
});

$('btn_join').addEventListener('click', async ()=>{
  const name = ($('name_input').value || 'Player').trim();
  const code = ($('code_input').value || '').trim().toUpperCase();
  if(code.length < 4){ showError('Enter a 4-letter code'); return; }
  try { localStorage.setItem('bingbang_name', name); } catch {}
  try { await connect(); } catch { showError('Cannot reach server'); return; }
  send({type:'join', code, name});
  // wait for lobby payload before showing screen — but optimistically show
  setTimeout(()=>{ if(lobby) showMenu('menu_lobby'); }, 150);
});

$('btn_leave').addEventListener('click', ()=>{
  send({type:'leave'});
  if(ws){ try{ws.close();}catch{} ws=null; }
  goHome();
});

$('btn_start').addEventListener('click', ()=>{
  send({type:'start'});
});

$('btn_team_red').addEventListener('click', ()=>{
  // switchTeam toggles, only fire if we're not already on red
  const me = (lobby && lobby.players.find(p=>p.id===myPid));
  if(me && me.team !== 0) send({type:'switchTeam'});
});
$('btn_team_blue').addEventListener('click', ()=>{
  const me = (lobby && lobby.players.find(p=>p.id===myPid));
  if(me && me.team !== 1) send({type:'switchTeam'});
});

$('btn_rematch').addEventListener('click', ()=>{ send({type:'rematch'}); hideMenu('menu_gameover'); });
$('btn_rematch_leave').addEventListener('click', ()=>{
  send({type:'leave'});
  if(ws){ try{ws.close();}catch{} ws=null; }
  goHome();
});

function renderLobby(){
  if(!lobby) return;
  $('lobby_code').textContent = lobby.code.split('').join(' ');
  $('lobby_title').textContent = ({coop:'CO-OP LOBBY',ffa:'FFA LOBBY',tdm:'TDM LOBBY'})[lobby.mode] || 'LOBBY';
  const ul = $('lobby_players'); ul.innerHTML = '';
  for(const p of lobby.players){
    const li = document.createElement('li');
    li.innerHTML = `<span class="swatch" style="background:${p.color};color:${p.color}"></span>
      <span>${escapeHTML(p.name)}${p.id===myPid?' <span style="color:#888">(you)</span>':''}</span>
      ${p.id===lobby.host?'<span class="host">★ HOST</span>':''}
      ${lobby.mode==='tdm'?`<span style="margin-left:auto;color:${p.team===0?'#ff3366':'#4488ff'}">${p.team===0?'RED':'BLUE'}</span>`:''}`;
    ul.appendChild(li);
  }
  const isHost = lobby.host === myPid;
  $('btn_start').disabled = !isHost || lobby.players.length < 1;
  $('btn_start').textContent = isHost
    ? (lobby.players.length===1 ? 'START (SOLO)' : 'START GAME')
    : 'WAITING FOR HOST…';
  $('tdm_team_panel').style.display = lobby.mode==='tdm' ? 'block' : 'none';
}

function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showGameOver(){
  if(!state) return;
  const t = $('go_title'), s = $('go_summary');
  if(state.mode === 'coop'){
    t.textContent = state.winner ? 'VICTORY!' : 'DEFEAT';
    t.style.color = state.winner ? '#88ff88' : '#ff3366';
  } else if(state.mode === 'ffa' && state.winner){
    t.textContent = state.winner.id === myPid ? 'YOU WIN!' : `${state.winner.name} WINS`;
    t.style.color = state.winner.id === myPid ? '#88ff88' : '#ffaa44';
  } else if(state.mode === 'tdm' && state.winner){
    const team = state.winner.team;
    if(team === -1){ t.textContent = 'DRAW'; t.style.color = '#888'; }
    else {
      t.textContent = (team===0?'RED':'BLUE') + ' TEAM WINS';
      t.style.color = team===0 ? '#ff3366' : '#4488ff';
    }
  }
  // scoreboard
  const players = [...state.players].sort((a,b)=> (b.kills - a.kills) || (a.deaths - b.deaths));
  const teamScoreLine = state.mode==='tdm' && state.teamScores
    ? `<div style="text-align:center;font-size:24px;margin:8px 0">
         <span style="color:#ff3366">RED ${state.teamScores[0]}</span>
         &nbsp;·&nbsp;
         <span style="color:#4488ff">BLUE ${state.teamScores[1]}</span>
       </div>` : '';
  let rows = '';
  for(const p of players){
    const team = state.mode==='tdm' ? `<span style="color:${p.team===0?'#ff3366':'#4488ff'};font-size:11px">[${p.team===0?'R':'B'}]</span>` : '';
    rows += `<tr>
      <td><span style="display:inline-block;width:10px;height:10px;background:${p.color};border-radius:50%;margin-right:6px;vertical-align:middle"></span>${escapeHTML(p.name)} ${team}${p.id===myPid?' <span style="color:#888">(you)</span>':''}</td>
      <td style="color:#88ff88;text-align:right">${p.kills}</td>
      <td style="color:#ff8888;text-align:right">${p.deaths}</td>
    </tr>`;
  }
  s.innerHTML = `${teamScoreLine}
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px">
      <thead style="color:#888;text-transform:uppercase;font-size:11px;letter-spacing:2px">
        <tr><th style="text-align:left;padding:4px">Player</th><th style="text-align:right;padding:4px">Kills</th><th style="text-align:right;padding:4px">Deaths</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  showMenu('menu_gameover');
}

// INPUT
// ═══════════════════════════════════════════════════════════════════════════
const keys = new Set();
const mouse = { x: W/2, y: H/2, down: false };
let lastInputSent = 0;
let dashPending = false;

window.addEventListener('keydown', e => {
  // Ignore inputs while typing in the menu
  if(currentScreen !== 'game') return;
  keys.add(e.code);
  if(e.code === 'Space'){ dashPending = true; e.preventDefault(); }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys.delete(e.code); });

canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('mousedown', e=>{ if(e.button===0) mouse.down = true; getAC(); });
canvas.addEventListener('mouseup',   e=>{ if(e.button===0) mouse.down = false; });

// Card hover/click
let cardChoices = [];
let hoveredCard = -1;
canvas.addEventListener('click', ()=>{
  if(selfPicking && hoveredCard >= 0){
    send({type:'pickCard', idx: hoveredCard});
    cardChoices = []; hoveredCard = -1; selfPicking = false; snd.pickup();
  }
});
canvas.addEventListener('mousemove', ()=>{
  if(selfPicking && cardChoices.length){
    const cW=228,gap=38,sx=(W-(cW*3+gap*2))/2,cy=216;
    hoveredCard = -1;
    cardChoices.forEach((_,i)=>{
      const cx=sx+i*(cW+gap);
      if(mouse.x>=cx && mouse.x<=cx+cW && mouse.y>=cy && mouse.y<=cy+295) hoveredCard = i;
    });
  }
});

// Input streaming loop
function streamInput(now){
  if(currentScreen!=='game' || !state){ return; }
  if(now - lastInputSent < 50 && !dashPending) return;  // ~20Hz
  lastInputSent = now;
  send({type:'input',
    keys: [...keys],
    mx: mouse.x, my: mouse.y,
    fire: mouse.down,
    dash: dashPending,
  });
  dashPending = false;
}

// LOCAL FX
// ═══════════════════════════════════════════════════════════════════════════
const particles = [];
const dmgNums = [];
const bloods = [];
const corpses = [];
let shake = 0;

function spawnParticle(x,y,color,n,life,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(60+Math.random()*200)*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life,ml:life,r:2+Math.random()*4});
  }
}
function addDmgNum(x,y,val,color){ dmgNums.push({x,y,val:String(val),color,life:1,ml:1,vy:-65}); }
function addBlood(x,y){
  const nr=20+Math.random()*14; const drops=[];
  for(let j=0;j<4+Math.floor(Math.random()*5);j++){
    const a=Math.random()*Math.PI*2, d=Math.random()*nr*1.4;
    drops.push({x:x+Math.cos(a)*d, y:y+Math.sin(a)*d, r:4+Math.random()*9});
  }
  if(bloods.length>80) bloods.shift();
  bloods.push({x,y,r:nr,drops});
}
function addCorpse(x,y,color){
  if(corpses.length>60) corpses.shift();
  corpses.push({x,y,color,angle:Math.random()*Math.PI*2,life:18,ml:18});
}
function updateFX(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vx*=0.89; p.vy*=0.89; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i]; d.life-=dt;
    if(d.life<=0){ dmgNums.splice(i,1); continue; } d.y+=d.vy*dt;
  }
  for(let i=corpses.length-1;i>=0;i--){
    corpses[i].life-=dt; if(corpses[i].life<=0) corpses.splice(i,1);
  }
  shake = Math.max(0, shake - shake * 10 * dt);
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════════════════
function drawFloor(){
  ctx.fillStyle='#030306'; ctx.fillRect(0,0,W,H);
  const T=40;
  for(const z of FLOOR_ZONES){
    for(let ty=0;ty<z.h;ty+=T){
      for(let tx=0;tx<z.w;tx+=T){
        const even=(Math.floor((z.x+tx)/T)+Math.floor((z.y+ty)/T))%2===0;
        ctx.fillStyle=even?z.c1:z.c2;
        ctx.fillRect(z.x+tx,z.y+ty,Math.min(T,z.w-tx),Math.min(T,z.h-ty));
      }
    }
  }
}
function drawBloods(){
  ctx.save(); ctx.fillStyle='#4a0000'; ctx.globalAlpha=0.82;
  for(const b of bloods){
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    for(const d of b.drops){ ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha=1; ctx.restore();
}
function drawCorpses(){
  ctx.save();
  for(const c of corpses){
    const a=0.48*(c.life/c.ml);
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
    ctx.globalAlpha=a; ctx.fillStyle=c.color;
    ctx.scale(1.3,0.55);
    ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.restore();
}
function drawWalls(){
  for(const w of WALLS){
    ctx.fillStyle='#02020a'; ctx.fillRect(w.x+4,w.y+4,w.w,w.h);
    ctx.fillStyle='#12122e'; ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle='#20205a'; ctx.fillRect(w.x,w.y,w.w,Math.min(5,w.h));
    ctx.fillStyle='#1c1c4c'; ctx.fillRect(w.x,w.y,Math.min(4,w.w),w.h);
    ctx.strokeStyle='#2a2a70'; ctx.lineWidth=1;
    ctx.strokeRect(w.x+.5,w.y+.5,w.w-1,w.h-1);
  }
}
function drawPlayers(){
  if(!state) return;
  for(const p of state.players){
    if(!p.alive){
      // dead marker
      ctx.save(); ctx.globalAlpha=0.35; ctx.strokeStyle=p.color; ctx.lineWidth=2;
      ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      // nameplate
      ctx.fillStyle='#666'; ctx.font='11px monospace'; ctx.textAlign='center';
      ctx.fillText(p.name+' (down)', p.x, p.y - p.r - 8);
      continue;
    }
    if(p.invuln>0 && Math.floor(p.invuln*20)%2 && p.id !== myPid) continue;
    ctx.save(); ctx.translate(p.x, p.y);
    // ability rings
    const uniq = [...new Set(p.abilities)];
    uniq.forEach((id,i)=>{
      const ab = ABILITY_META[id]; if(!ab) return;
      ctx.globalAlpha=0.18; ctx.strokeStyle=ab.c; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,p.r+8+i*5,0,Math.PI*2); ctx.stroke();
    });
    ctx.globalAlpha=1;
    if(p.shield){
      ctx.strokeStyle='#ffd700'; ctx.lineWidth=3;
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=18; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(0,0,p.r+5,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
    // dash arc
    if(p.abilities.includes('dash')){
      const cf=p.dashCd/p.dashMaxCd;
      if(cf>0){
        ctx.strokeStyle='#006655'; ctx.lineWidth=3; ctx.globalAlpha=0.5;
        ctx.beginPath(); ctx.arc(0,0,p.r+13,-Math.PI/2,-Math.PI/2+cf*Math.PI*2); ctx.stroke();
      } else {
        ctx.strokeStyle='#00ffee'; ctx.lineWidth=2; ctx.globalAlpha=0.6;
        ctx.beginPath(); ctx.arc(0,0,p.r+13,0,Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.rotate(p.angle);
    ctx.shadowColor=p.color; ctx.shadowBlur=22;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(0,0,p.r*0.45,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#eee';
    ctx.fillRect(p.r-5,-5,24,10);
    ctx.restore();
    // nameplate + tiny hp bar (over teammates / others)
    if(p.id !== myPid){
      ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
      const teamCol = state.mode==='tdm' ? (p.team===0?'#ff3366':'#4488ff') : '#aaa';
      ctx.fillStyle = teamCol;
      ctx.fillText(p.name, p.x, p.y - p.r - 12);
      const w=44, hf=Math.max(0,p.hp/p.maxHp);
      ctx.fillStyle='#222'; ctx.fillRect(p.x-w/2, p.y-p.r-8, w, 4);
      ctx.fillStyle = hf>0.5?'#88ff88':hf>0.25?'#ff8800':'#ff3366';
      ctx.fillRect(p.x-w/2, p.y-p.r-8, w*hf, 4);
    }
  }
}
function drawBots(){
  if(!state) return;
  for(const bot of state.bots){
    const isFrozen = bot.frozen > 0;
    const col = isFrozen ? '#88ddff' : bot.color;
    ctx.save(); ctx.translate(bot.x,bot.y);
    ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(0,0,bot.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    if(isFrozen){
      ctx.strokeStyle='#ccf5ff'; ctx.lineWidth=2;
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*(bot.r+9),Math.sin(a)*(bot.r+9)); ctx.stroke();
      }
    }
    ctx.rotate(bot.angle); ctx.fillStyle=isFrozen?'#88ddff':'#ddd';
    ctx.fillRect(bot.r-4,-4,16,8);
    ctx.restore();
    const bw=bot.r*3;
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(bot.x-bw/2,bot.y-bot.r-13,bw,5);
    ctx.fillStyle=isFrozen?'#88ddff':(bot.hp/bot.maxHp>0.5?'#ff3366':'#ff8800');
    ctx.fillRect(bot.x-bw/2,bot.y-bot.r-13,bw*Math.max(0,bot.hp/bot.maxHp),5);
  }
}
function drawBullets(){
  if(!state) return;
  ctx.save();
  for(const b of state.bullets){
    ctx.shadowColor=b.c; ctx.shadowBlur=16; ctx.fillStyle=b.c;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  }
  ctx.restore();
}
function drawParticles(){
  ctx.save();
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.ml);
    ctx.shadowColor=p.color; ctx.shadowBlur=6; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
}
function drawDmgNums(){
  ctx.save();
  for(const d of dmgNums){
    ctx.globalAlpha=Math.max(0,d.life/d.ml);
    ctx.shadowColor=d.color; ctx.shadowBlur=9; ctx.fillStyle=d.color;
    ctx.font='bold 19px monospace'; ctx.textAlign='center';
    ctx.fillText(d.val,d.x,d.y);
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
}
function drawScanlines(){
  ctx.save(); ctx.globalAlpha=0.025; ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1); ctx.restore();
}
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,160,W/2,H/2,680);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawHUD(){
  if(!state) return;
  ctx.textAlign='left';
  // top-left: mode + wave/score
  ctx.fillStyle='#ffff00'; ctx.shadowColor='#ffff00'; ctx.shadowBlur=8;
  ctx.font='bold 22px monospace';
  if(state.mode==='coop'){
    ctx.fillText(`WAVE ${state.wave}`,30,42);
    if(state.remaining>0){ ctx.shadowBlur=0; ctx.fillStyle='#777'; ctx.font='13px monospace';
      ctx.fillText(`${state.remaining} remaining`,30,60); }
  } else if(state.mode==='ffa'){
    const me = state.players.find(p=>p.id===myPid);
    ctx.fillText(`FFA — first to ${state.targetScore} kills`, 30, 42);
    if(me){ ctx.shadowBlur=0; ctx.fillStyle='#888'; ctx.font='13px monospace';
      ctx.fillText(`Your kills: ${me.kills} / ${state.targetScore}`,30,60); }
  } else if(state.mode==='tdm'){
    const [r,bl] = state.teamScores;
    ctx.fillStyle='#ff3366'; ctx.fillText(`RED ${r}`, 30, 42);
    ctx.fillStyle='#fff'; ctx.fillText(' — ', 130, 42);
    ctx.fillStyle='#4488ff'; ctx.fillText(`BLUE ${bl}`, 170, 42);
    ctx.shadowBlur=0; ctx.fillStyle='#888'; ctx.font='13px monospace';
    ctx.fillText(`first to ${state.targetScore}`,30,60);
  }
  ctx.shadowBlur=0;
  // top-center: match timer (PvP)
  if(state.matchTimeLeft != null){
    const mm = Math.floor(state.matchTimeLeft/60), ss=Math.floor(state.matchTimeLeft%60);
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 22px monospace';
    ctx.fillText(`${mm}:${String(ss).padStart(2,'0')}`, W/2, 42);
  }
  // top-right: scoreboard mini
  ctx.textAlign='right'; ctx.font='12px monospace';
  let yy = 36;
  const sorted = [...state.players].sort((a,b)=>(b.kills-a.kills)||(a.deaths-b.deaths));
  for(const p of sorted){
    ctx.fillStyle = p.id===myPid ? '#fff' : (state.mode==='tdm'?(p.team===0?'#ff7799':'#88aaff'):'#aaa');
    const star = p.id === myPid ? '▸ ' : '';
    ctx.fillText(`${star}${p.name}  ${p.kills}k / ${p.deaths}d`, W-28, yy);
    yy += 16;
  }
  // bottom-left: my HP + abilities
  const me = state.players.find(p=>p.id===myPid);
  if(me){
    ctx.textAlign='left';
    const bx=30, by=H-46, bw=220, bh=20, hf=Math.max(0,me.hp/me.maxHp);
    const hcol = hf>0.5?'#00e5ff':hf>0.25?'#ff8800':'#ff3366';
    ctx.fillStyle='#111'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=hcol; ctx.shadowColor=hcol; ctx.shadowBlur=10;
    ctx.fillRect(bx,by,bw*hf,bh); ctx.shadowBlur=0;
    ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#fff'; ctx.font='bold 13px monospace';
    ctx.fillText(`HP  ${Math.ceil(Math.max(0,me.hp))} / ${me.maxHp}${me.alive?'':' — RESPAWNING'}`, bx+7, by+14);
    // ability bar (bottom-right)
    me.abilities.forEach((id,i)=>{
      const ab = ABILITY_META[id]; if(!ab) return;
      const x=W-30-i*48, y=H-46+10;
      ctx.shadowColor=ab.c; ctx.shadowBlur=12; ctx.fillStyle=ab.c; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(x,y,19,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0; ctx.globalAlpha=1;
      ctx.font='17px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#000';
      ctx.fillText(ab.i,x,y+6);
    });
    ctx.textAlign='left';
  }
  // code corner
  ctx.fillStyle='#444'; ctx.font='11px monospace'; ctx.textAlign='right';
  ctx.fillText(`ROOM ${state.code}`, W-28, H-26);
}

function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y);
  c.arcTo(x+w,y,x+w,y+r,r); c.lineTo(x+w,y+h-r);
  c.arcTo(x+w,y+h,x+w-r,y+h,r); c.lineTo(x+r,y+h);
  c.arcTo(x,y+h,x,y+h-r,r); c.lineTo(x,y+r);
  c.arcTo(x,y,x+r,y,r); c.closePath();
}
function wrapText(c,text,x,y,maxW,lh){
  const words=text.split(' '); let line=''; const lines=[];
  for(const w of words){
    const t=line+w+' ';
    if(c.measureText(t).width>maxW&&line){lines.push(line.trim());line=w+' ';}else line=t;
  }
  if(line)lines.push(line.trim());
  lines.forEach((l,i)=>c.fillText(l,x,y+i*lh));
}

function drawCardSelect(){
  if(!selfPicking || !cardChoices.length) return;
  ctx.fillStyle='rgba(4,4,18,0.85)'; ctx.fillRect(0,0,W,H);
  const hue=(performance.now()/6)%360;
  ctx.fillStyle=`hsl(${hue},100%,68%)`; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=22;
  ctx.font='bold 38px monospace'; ctx.textAlign='center';
  ctx.fillText(`CHOOSE AN UPGRADE`,W/2,150); ctx.shadowBlur=0;
  ctx.fillStyle='#999'; ctx.font='16px monospace';
  ctx.fillText('Pick a card — your other players can keep playing', W/2, 188);
  const cW=228,cH=295,gap=38,sx=(W-(cW*3+gap*2))/2,cy=216;
  cardChoices.forEach((ab,i)=>{
    const cx=sx+i*(cW+gap), hov=hoveredCard===i;
    ctx.save();
    if(hov){ ctx.shadowColor=ab.color; ctx.shadowBlur=28; }
    ctx.fillStyle=hov?'#0d0d26':'#090919';
    ctx.strokeStyle=ab.color; ctx.lineWidth=hov?3:1.5;
    roundRect(ctx,cx,cy,cW,cH,14); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.font='52px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.fillText(ab.icon,cx+cW/2,cy+78);
    ctx.fillStyle=ab.color; ctx.shadowColor=ab.color; ctx.shadowBlur=9;
    ctx.font='bold 16px monospace'; ctx.fillText(ab.name,cx+cW/2,cy+114); ctx.shadowBlur=0;
    ctx.fillStyle='#bbb'; ctx.font='13px monospace'; wrapText(ctx,ab.desc,cx+cW/2,cy+142,cW-30,20);
    if(ab.stacks > 0){
      ctx.fillStyle='#ffd700'; ctx.shadowColor='#ffd700'; ctx.shadowBlur=8;
      ctx.font='bold 12px monospace';
      ctx.fillText(`★ LVL ${ab.stacks} → ${ab.stacks+1}`,cx+cW/2,cy+cH-20);
      ctx.shadowBlur=0;
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════════
let lastTime = 0;
function loop(ts){
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;

  streamInput(ts);
  updateFX(dt);

  if(currentScreen === 'game' && state){
    const sx = (Math.random()-0.5)*shake*2, sy = (Math.random()-0.5)*shake*2;
    ctx.save(); ctx.translate(sx,sy);
    drawFloor(); drawBloods(); drawCorpses(); drawWalls();
    drawParticles(); drawBullets(); drawBots(); drawPlayers();
    drawDmgNums(); drawVignette(); drawScanlines();
    drawHUD();
    if(selfPicking) drawCardSelect();
    ctx.restore();
  } else {
    // still draw canvas backdrop while menus are up
    ctx.fillStyle='#04040e'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=0.4;
    for(let ty=0;ty<H;ty+=40) for(let tx=0;tx<W;tx+=40){
      ctx.fillStyle=(Math.floor(tx/40)+Math.floor(ty/40))%2===0?'#0a0a18':'#0c0c1e';
      ctx.fillRect(tx,ty,40,40);
    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
